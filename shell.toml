# Space shell: glass bar, hairline chrome, sky blue focus. Square corners from Hyprland rounding = 0.

[bar]
background       = "#0B0401"
background-alpha = 0.85
text             = "#EDDDC3"
active           = "#537CBB"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border            = "rgba(537cbbee)"
active-border-foreground = "rgba(edddc3cc)"

[controls]
normal-color        = "#EDDDC3"
normal-fill-alpha   = 0.04
normal-border       = "#EDDDC3"
normal-border-width = 1
normal-border-alpha = 0.12

hover-cursor-color        = "#EDDDC3"
hover-cursor-fill-alpha   = 0.08
hover-cursor-border       = "#537CBB"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.35

focus-color        = "#F2E6D2"
focus-fill-alpha   = 0.08
focus-border       = "#537CBB"
focus-border-width = 1
focus-border-alpha = 0.55

selected-color        = "#F2E6D2"
selected-fill-alpha   = 0.10
selected-border       = "#537CBB"
selected-border-width = 1
selected-border-alpha = 0.40

pressed-fill-alpha   = 0.18
selection-fill-alpha = 0.28

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#231D1A"
background-alpha = 0.95
text             = "#EDDDC3"
border           = "hyprland.active-border"
border-alpha     = 0.70
border-width     = 1

[tooltip]
background       = "#231D1A"
background-alpha = 0.92
text             = "#EDDDC3"
border           = "hyprland.active-border-foreground"
border-alpha     = 0.35

[notifications]
background       = "#231D1A"
background-alpha = 0.95
text             = "#EDDDC3"
border           = "hyprland.active-border"
border-alpha     = 0.70
border-width     = 1
countdown        = "#537CBB"

[launcher]
background                = "#231D1A"
background-alpha          = 0.92
text                      = "#EDDDC3"
border                    = "hyprland.active-border-foreground"
border-alpha              = 0.35
scrim                     = "#0B0401"
scrim-alpha               = 0.55
selected-background       = "#EDDDC3"
selected-background-alpha = 0.08
selected-text             = "#537CBB"
selected-border           = "#537CBB"
selected-border-alpha     = 0.35

[menu]
background                = "#231D1A"
background-alpha          = 0.95
text                      = "#EDDDC3"
border                    = "hyprland.active-border-foreground"
border-alpha              = 0.35
scrim                     = "#0B0401"
scrim-alpha               = 0.55
selected-background       = "#EDDDC3"
selected-background-alpha = 0.08
selected-text             = "#537CBB"
selected-border           = "#537CBB"
selected-border-alpha     = 0.35

[polkit]
background       = "#231D1A"
background-alpha = 0.95
text             = "#EDDDC3"
text-error       = "#AC7136"
border           = "hyprland.active-border"
border-error     = "#AC7136"
border-alpha     = 0.70
scrim            = "#0B0401"
scrim-alpha      = 0.55
accent           = "#537CBB"

[lock]
background       = "#0B0401"
background-alpha = 0.80
text             = "#EDDDC3"
placeholder      = "#6D6763"
text-error       = "#AC7136"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#AC7136"
border-alpha     = 0.70
selection        = "#537CBB"
selection-alpha  = 0.40

[image-picker]
scrim                   = "#0B0401"
scrim-alpha             = 0.55
text                    = "#EDDDC3"
selected-border         = "#537CBB"
selected-border-alpha   = 1.0
unselected-border       = "#EDDDC3"
unselected-border-alpha = 0.18
