# Space shell: glass bar, hairline chrome, sunset focus. Square corners from Hyprland rounding = 0.

[bar]
background       = "#0A0A0A"
background-alpha = 0.85
text             = "#ECECED"
active           = "#FF6308"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border            = "rgba(ff6308ee)"
active-border-foreground = "rgba(ececedcc)"

[controls]
normal-color        = "#ECECED"
normal-fill-alpha   = 0.04
normal-border       = "#ECECED"
normal-border-width = 1
normal-border-alpha = 0.12

hover-cursor-color        = "#ECECED"
hover-cursor-fill-alpha   = 0.08
hover-cursor-border       = "#FF6308"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.35

focus-color        = "#FFFFFF"
focus-fill-alpha   = 0.08
focus-border       = "#FF6308"
focus-border-width = 1
focus-border-alpha = 0.55

selected-color        = "#FFFFFF"
selected-fill-alpha   = 0.10
selected-border       = "#FF6308"
selected-border-width = 1
selected-border-alpha = 0.40

pressed-fill-alpha   = 0.18
selection-fill-alpha = 0.28

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#1A1A1A"
background-alpha = 0.95
text             = "#ECECED"
border           = "hyprland.active-border"
border-alpha     = 0.70
border-width     = 1

[tooltip]
background       = "#1A1A1A"
background-alpha = 0.92
text             = "#ECECED"
border           = "hyprland.active-border-foreground"
border-alpha     = 0.35

[notifications]
background       = "#1A1A1A"
background-alpha = 0.95
text             = "#ECECED"
border           = "hyprland.active-border"
border-alpha     = 0.70
border-width     = 1
countdown        = "#FF6308"

[launcher]
background                = "#1A1A1A"
background-alpha          = 0.92
text                      = "#ECECED"
border                    = "hyprland.active-border-foreground"
border-alpha              = 0.35
scrim                     = "#0A0A0A"
scrim-alpha               = 0.55
selected-background       = "#D5D9E2"
selected-background-alpha = 0.08
selected-text             = "#FF6308"
selected-border           = "#FF6308"
selected-border-alpha     = 0.35

[menu]
background                = "#1A1A1A"
background-alpha          = 0.95
text                      = "#ECECED"
border                    = "hyprland.active-border-foreground"
border-alpha              = 0.35
scrim                     = "#0A0A0A"
scrim-alpha               = 0.55
selected-background       = "#D5D9E2"
selected-background-alpha = 0.08
selected-text             = "#FF6308"
selected-border           = "#FF6308"
selected-border-alpha     = 0.35

[polkit]
background       = "#1A1A1A"
background-alpha = 0.95
text             = "#ECECED"
text-error       = "#E24A2A"
border           = "hyprland.active-border"
border-error     = "#E24A2A"
border-alpha     = 0.70
scrim            = "#0A0A0A"
scrim-alpha      = 0.55
accent           = "#FF6308"

[lock]
background       = "#0A0A0A"
background-alpha = 0.80
text             = "#ECECED"
placeholder      = "#7D8187"
text-error       = "#E24A2A"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#E24A2A"
border-alpha     = 0.70
selection        = "#FF6308"
selection-alpha  = 0.40

[image-picker]
scrim                   = "#0A0A0A"
scrim-alpha             = 0.55
text                    = "#ECECED"
selected-border         = "#FF6308"
selected-border-alpha   = 1.0
unselected-border       = "#ECECED"
unselected-border-alpha = 0.18
